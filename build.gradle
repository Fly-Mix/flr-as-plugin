import org.jetbrains.intellij.platform.gradle.TestFrameworkType
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

// 构建环境：Gradle 8.13+（IntelliJ Platform Gradle Plugin 2.x 最低要求）、JDK 17
plugins {
    id 'java'

    /*
    Kotlin JVM 插件（Java→Kotlin 迁移用）：
    - 版本 2.2.21：与 Gradle 9.6 兼容（平台内置 Kotlin 编译器为 2.0.21，仅作运行时；编译器可较新）
    - 不打包 kotlin-stdlib（见 gradle.properties: kotlin.stdlib.default.dependency=false），依赖平台内置运行时
    - api/languageVersion pin 到 2.0，对齐平台内置 kotlin 2.0.21（见下方 kotlin{} 块）
    */
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'

    /*
    构建 IntelliJ 插件用的 Gradle 插件：
    - 旧：Gradle IntelliJ Plugin  id 'org.jetbrains.intellij'（1.x，已 EOL；且不兼容 Gradle 9.x）
    - 新：IntelliJ Platform Gradle Plugin  id 'org.jetbrains.intellij.platform'（2.x，当前唯一维护）
      · 最低要求 Gradle 8.13 + JDK 17
      · 依赖模型变化：目标 IDE 与依赖插件、测试框架均在 dependencies { intellijPlatform { ... } } 中声明
    */
    id 'org.jetbrains.intellij.platform' version '2.17.0'
}

// 插件需要支持的 IntelliJ IDEA Community Edition平台版本
// 平台版本使用其 branch_number 作为区分
enum PlatformType {
    // Android Studio 3.5
    IC_191 ('191'),
    // Android Studio 3.6
    IC_192 ('192'),
    // Android Studio 4.0
    IC_193 ('193'),
    // Android Studio 4.1
    IC_201 ('201'),
    // Android Studio 4.2
    IC_202 ('202'),
    // Android Studio - Arctic Fox | 2020.3.1
    IC_203 ('203'),
    // Android Studio Bumblebee | 2021.1.1
    IC_211 ('211'),
    // Android Studio Chipmunk | 2021.2.1
    IC_212 ('212'),
    // Android Studio Dolphin | 2021.3.1
    IC_213 ('213'),
    // Android Studio Electric Eel | 2022.1.1
    IC_221 ('221'),
    // Android Studio Flamingo | 2022.2.1
    IC_222 ('222'),
    // Android Studio Giraffe | 2022.3.1
    IC_223 ('223'),
    // Android Studio Hedgehog | 2023.1.1
    IC_231 ('231'),
    // Android Studio Meerkat | 2024.3.1
    IC_243 ('243'),

    final String branchNumber

    PlatformType(String branchNumber) {
        this.branchNumber = branchNumber
    }

    String getBranchNumber() {
        return this.branchNumber
    }

    String toString(){
        'IC-' + branchNumber
    }
}

// flr-plugin-engine 的版本号（完成一个新版本的 flr-plugin-engine 开发后手动更新）
String pluginEngineVersion = '3.4.0'

// 用于开发 flr-plugin-engine 时使用平台版本（一般使用最新平台版本）
PlatformType pluginEnginePlatform = PlatformType.IC_243

// 用于开发 flr-plugin 时使用平台版本（切换到 platform-master 分支后手动更新）
PlatformType pluginProductPlatform = pluginEnginePlatform

// 指定JDK版本
// JDK8: '1.8'or'8'；JDK11: '11'（IDEA 2020.2 起）；JDK17：IDEA 2022.2.3 起
// 注意：Gradle 9 起 sourceCompatibility 不再是 Project 属性，需经下面的 java{} 扩展设置
String javaVersion = '8'
switch (pluginProductPlatform) {
    case PlatformType.IC_191:
    case PlatformType.IC_192:
    case PlatformType.IC_193:
    case PlatformType.IC_201:
        javaVersion = '8'
        break
    case PlatformType.IC_202:
    case PlatformType.IC_203:
    case PlatformType.IC_211:
    case PlatformType.IC_212:
    case PlatformType.IC_213:
    case PlatformType.IC_221:
        javaVersion = '11'
        break
    case PlatformType.IC_222:
    case PlatformType.IC_223:
    case PlatformType.IC_231:
    case PlatformType.IC_243:
        javaVersion = '17'
        break
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

// Kotlin 编译配置：jvmTarget 与 Java targetCompatibility(17) 对齐；
// api/languageVersion pin 到 2.0，不超过平台内置 kotlin(2.0.21)，避免引用运行时不存在的新 stdlib API。
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        apiVersion = KotlinVersion.KOTLIN_2_0
        languageVersion = KotlinVersion.KOTLIN_2_0
    }
}

// flr-plugin 的版本号：plugin_product_version = #{IC_branch_number}.#{plugin_engine_version}
// example: IC_branch_number=191, plugin_engine_version=1.0.0 -> 191.1.0.0
String pluginProductVersion = pluginProductPlatform.branchNumber + '.' + pluginEngineVersion

// 项目版本；打包产物名由 project.name + version 得出，例如 flr-as-plugin-243.3.4.0.zip
version = pluginProductVersion

println "flr-as-plugin 构建配置信息如下："
println " - PluginProductPlatform: ${pluginProductPlatform}"
println " - SourceCompatibility: JDK${javaVersion}"
println " - PluginProductVersion: ${pluginProductVersion}"

// 平台版本与依赖插件版本（原在 intellij{} 块内，2.x 需在 dependencies/pluginConfiguration 中使用，故上移到顶层）
// platformPlugins 元素约定：'java' 表示平台自带插件 com.intellij.java；'#{id}:#{version}' 表示 marketplace 插件
String platformVersion = null
List platformPlugins = null
switch (pluginProductPlatform) {
    case PlatformType.IC_191:
        platformVersion = '2019.1.4'
        platformPlugins = ['Dart:191.8593', 'io.flutter:43.0.1']
        break
    case PlatformType.IC_192:
        platformVersion = '2019.2.4'
        platformPlugins = ['Dart:192.7761', 'io.flutter:43.0.2']
        break
    case PlatformType.IC_193:
        platformVersion = '2019.3.3'
        platformPlugins = ['Dart:193.7361', 'io.flutter:45.1.2']
        break
    case PlatformType.IC_201:
        platformVersion = '2020.1.4'
        platformPlugins = ['Dart:201.9002', 'io.flutter:50.0.2']
        break
    case PlatformType.IC_202:
        platformVersion = '2020.2.3'
        platformPlugins = ['Dart:202.8488', 'io.flutter:56.0.2']
        break
    case PlatformType.IC_203:
        platformVersion = '2020.3.1'
        platformPlugins = ['Dart:203.8292', 'io.flutter:59.0.2']
        break
    case PlatformType.IC_211:
        platformVersion = '2021.1'
        platformPlugins = ['Dart:211.7798', 'io.flutter:64.1.2']
        break
    case PlatformType.IC_212:
        platformVersion = '2021.2.3'
        platformPlugins = ['Dart:212.5744', 'io.flutter:67.1.2']
        break
    case PlatformType.IC_213:
        platformVersion = '2021.3.2'
        platformPlugins = ['Dart:213.7371', 'io.flutter:70.0.3']
        break
    case PlatformType.IC_221:
        platformVersion = '2022.1.4'
        platformPlugins = ['java', 'Dart:221.6096', 'io.flutter:71.2.4']
        break
    case PlatformType.IC_222:
        platformVersion = '2022.2.4'
        platformPlugins = ['java', 'Dart:222.4582', 'io.flutter:73.0.2']
        break
    case PlatformType.IC_223:
        platformVersion = '2022.3.3'
        platformPlugins = ['java', 'Dart:223.8950', 'io.flutter:73.0.3']
        break
    case PlatformType.IC_231:
        platformVersion = '2023.1.5'
        platformPlugins = ['java', 'Dart:231.9402', 'io.flutter:77.1.2']
        break
    case PlatformType.IC_243:
        platformVersion = '2024.3.1'
        platformPlugins = ['java', 'Dart:243.23177', 'io.flutter:82.2.4']
        break
}
assert(platformVersion != null && platformPlugins != null)

repositories {
    mavenCentral()
    // 2.x：目标 IDE、marketplace 插件、测试框架等均从此处的仓库解析
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    // 2.x：一切构建/测试所需（目标 IDE、依赖插件、测试框架、工具）都作为依赖显式声明
    intellijPlatform {
        // 目标基座平台（与 1.x 的 intellij.version 一致：IntelliJ IDEA Community）
        // 默认从官方仓库下载；受限网络/离线时可用 -PflrLocalIde=/path/to/installed-ide 指向本地已安装 IDE 绕开下载
        if (project.hasProperty('flrLocalIde')) {
            local project.property('flrLocalIde')
        } else {
            intellijIdeaCommunity platformVersion
        }

        // 依赖插件：'java' -> 平台自带插件；'#{id}:#{version}' -> marketplace 插件（Dart / io.flutter）
        platformPlugins.each { String p ->
            if (p == 'java') {
                bundledPlugin 'com.intellij.java'
            } else {
                String[] a = p.split(':')
                plugin a[0], a[1]
            }
        }

        // 平台自带 YAML 插件：pubspec.yaml 的注释保留写入（PubspecPsiWriter）用其 YAML PSI（各目标平台均捆绑）
        bundledPlugin 'org.jetbrains.plugins.yaml'

        // 平台测试框架（BasePlatformTestCase 等所需；2.x 必须显式声明）
        testFramework TestFrameworkType.Platform.INSTANCE

        // JetBrains Runtime（JBR 21）：2024.3 平台运行时；buildSearchableOptions/runIde/平台测试均需要
        jetbrainsRuntime()

        // 工具：插件校验器 / 打包签名器
        pluginVerifier()
        zipSigner()
    }

    testImplementation 'junit:junit:4.12'
    implementation 'org.yaml:snakeyaml:1.26'
}

// headless 基准回归测试的运行参数（可用 -PflrDemoPath / -PflrDartPath 覆盖）：
// - flr.demo.path：基准工程 flutter_r_demo 路径，默认同级目录；缺失时相关测试自动跳过
// - flr.dart.path：dart 可执行文件，用于对 r.g.dart 做归一化比较（脱离 formatter 版本）
test {
    systemProperty 'flr.demo.path',
            project.hasProperty('flrDemoPath') ? project.property('flrDemoPath') : "${rootProject.projectDir}/../flutter_r_demo"
    systemProperty 'flr.dart.path',
            project.hasProperty('flrDartPath') ? project.property('flrDartPath') : '/Users/York/.flutter/flutter/bin/dart'
}

// 2.x：插件元信息配置（取代 1.x 的 intellij{} + patchPluginXml{}）
intellijPlatform {
    // Flr 无可搜索的设置项，关闭 buildSearchableOptions（其会启动 headless IDE，既慢又易出问题）
    buildSearchableOptions = false

    pluginConfiguration {
        version = pluginProductVersion

        description = """
<p>Flr (Flutter-R): A Flutter Resource Manager Android Studio Plugin, which can help flutter developer to auto specify assets in pubspec.yaml and generate r.g.dart file.</p>
<br>
<p>You can get more details from:</p>
<ul>
  <li><a href="https://github.com/Fly-Mix/flr-as-plugin">Flr GitHub Repository</a></li>
  <li><a href="https://plugins.jetbrains.com/plugin/13789-flr/">Flr Plugin Homepage</a></li>
</ul>
        """

        ideaVersion {
            // 最小兼容版本；untilBuild 沿用插件默认（当前平台分支 .*，与 1.x 现状一致）
            sinceBuild = pluginProductPlatform.branchNumber
        }

        changeNotes = """
<h2>Flr Plugin Change Notes</h2>
<i><b>Attention:</b> Flr v243.* is built for Android Studio Meerkat | 2024.3.1</i>
<h3>243.3.4.0</h3>
<br/>
<h2>Flr Plugin Engine Change Notes</h2>
<h3>3.4.0</h3>
<ul>
  <li>Migrate existing code from Components to modern APIs</li>
</ul>
<h3>3.3.1</h3>
<ul>
  <li>Fix bug</li>
</ul>
<h4>3.3.0</h4>
<ul>
  <li>Support for nullsafety-feature of Dart 2.12</li>
</ul>
<h4>3.2.0</h4>
<ul>
  <li>Add pubspec.yaml file tree view</li>
</ul>
<h4>3.1.0</h4>
<ul>
  <li>Support for processing(init/generate/monitor) multi projects(the main project and its sub projects in one workspace)</li>
  <li>Support for auto merging old asset specifications when specifying new assets</li>
</ul>
<h4>3.0.0</h4>
<ul>
  <li>Support for processing non-implied resource file which is outside of "lib/" directory (such as "~/path/to/flutter_r_demo/assets/images/test.png")</li>
  <li>New recommended flutter resource structure</li>
</ul>
